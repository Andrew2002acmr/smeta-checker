[project]
name = "smeta-checker"
version = "0.1.0"
description = "Аудит ведомости объемов работ (ВОР) по проектной документации"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    # LLM worker set: queue + db + model client + tracing. No PDF/VOR/HTTP.
    "celery==5.6.3",
    "openai==3.24.0",
    "prometheus-client==0.21.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "redis==8.1.0",
    "sentry-sdk[celery,sqlalchemy]==2.19.2",
    "sqlalchemy==2.1.5",
]

[dependency-groups]
full = [
    # API + PDF worker: HTTP, migrations, VOR parsing, PDF, Word export.
    "alembic==1.20.0",
    "fastapi==0.143.5",
    "lxml==6.1.3",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pillow==12.3.0",
    "pymupdf==2.0",
    "pymupdf-layout==2.0",
    "pymupdf4llm==2.0",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "rapid-table==3.0.2",
    "rapidocr==3.10.0",
    "sentry-sdk[fastapi,celery,sqlalchemy]==2.19.2",
    "onnxruntime==1.31.0",
    "opencv-python==4.11.0.86",
    "uvicorn==0.54.0",
    "jinja2>=3.1.6,<4",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "pyright==1.1.414",
    "pyyaml==6.0.3",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests/test_*.py"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py314"
# Flat layout without src/: tests extend sys.path before importing app modules.
lint.select = ["E4", "E7", "E9", "F", "B"]
lint.ignore = ["E402"]
lint.flake8-bugbear.extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[tool.uv]
default-groups = ["dev", "full"]
package = false

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.14"
include = ["pdf_binding.py", "audit_delivery.py", "audit_models.py", "workspace_models.py", "normative_corpus.py"]
reportMissingImports = true
