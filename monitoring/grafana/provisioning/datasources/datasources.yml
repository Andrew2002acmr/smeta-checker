apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: Postgres
    uid: postgres
    type: postgres
    access: proxy
    url: db:5432
    database: ${POSTGRES_DB:-smeta}
    user: ${POSTGRES_USER:-smeta}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
