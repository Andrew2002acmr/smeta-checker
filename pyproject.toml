[project]
name = "smeta-checker"
version = "0.1.0"
description = "Аудит ведомости объемов работ (ВОР) по проектной документации"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.143.5",
    "langfuse==5.0.1",
    "lxml==6.1.3",
    "openai==3.24.0",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pymupdf==1.28.2",
    "pymupdf-layout==1.28.2",
    "pymupdf4llm==1.28.2",
    "python-docx==1.2.0",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.5",
    "streamlit==1.65.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "pyright==1.1.414",
]

[tool.pytest.ini_options]
testpaths = ["tests/test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
# Flat layout without src/: tests extend sys.path before importing app modules.
lint.select = ["E4", "E7", "E9", "F"]
lint.ignore = ["E402"]

[tool.uv]
package = false

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["pdf_binding.py"]
reportMissingImports = true
