# Local Windows/Docker Desktop launch; use with --env-file .env.local
# and -p smeta-checker-local to keep data separate from other projects.
x-local-logging: &local-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  db:
    logging: *local-logging
  redis:
    logging: *local-logging
  api:
    logging: *local-logging
    environment:
      LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL:-}
      NORMATIVE_AUTO_ENABLED: ${NORMATIVE_AUTO_ENABLED:-1}
      NORMATIVE_KB_ROOT: /knowledge/electrical-norms
      NORMATIVE_ROAD_KB_ROOT: /knowledge/road-norms
    volumes:
      - type: bind
        source: ${NORMATIVE_KB_HOST_ROOT:-../knowledge-base/electrical-norms}
        target: /knowledge/electrical-norms
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NORMATIVE_ROAD_KB_HOST_ROOT:-../knowledge-base/road-norms}
        target: /knowledge/road-norms
        read_only: true
        bind:
          create_host_path: false
    image: smeta-checker-local-backend:dev
    ports: !override
      - "127.0.0.1:${API_PORT:-8000}:8000"
  migrate:
    logging: *local-logging
    image: smeta-checker-local-backend:dev
  worker-pdf:
    logging: *local-logging
    environment:
      LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL:-}
    image: smeta-checker-local-backend:dev
    command: ["celery", "-A", "audit_tasks:worker", "worker", "-Q", "pdf", "-c", "${AUDIT_PDF_CONCURRENCY:-2}", "--loglevel=INFO", "--max-memory-per-child", "1000000", "--max-tasks-per-child", "${AUDIT_MAX_TASKS_PER_CHILD:-50}", "-n", "pdf-worker@%h", "--pidfile", "/tmp/celery-pdf.pid"]
  worker-normative:
    logging: *local-logging
    environment:
      LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL:-}
    image: smeta-checker-local-backend:dev
    volumes:
      - type: bind
        source: ${NORMATIVE_KB_HOST_ROOT:-../knowledge-base/electrical-norms}
        target: /knowledge/electrical-norms
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NORMATIVE_ROAD_KB_HOST_ROOT:-../knowledge-base/road-norms}
        target: /knowledge/road-norms
        read_only: true
        bind:
          create_host_path: false
  worker-llm:
    logging: *local-logging
    environment:
      LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL:-}
    image: smeta-checker-local-llm:dev
    command: ["celery", "-A", "audit_tasks:worker", "worker", "-Q", "llm", "-c", "${AUDIT_LLM_CONCURRENCY:-2}", "--loglevel=INFO", "--max-tasks-per-child", "${AUDIT_MAX_TASKS_PER_CHILD:-50}", "-n", "llm-worker@%h", "--pidfile", "/tmp/celery-llm.pid"]
  task-relay:
    logging: *local-logging
    image: smeta-checker-local-llm:dev
  workspace:
    logging: *local-logging
    image: smeta-checker-local-workspace:dev
