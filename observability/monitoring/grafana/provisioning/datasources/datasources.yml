apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: Postgres
    uid: postgres
    type: postgres
    access: proxy
    url: obs-db:5432
    database: glitchtip
    user: ${OBS_POSTGRES_USER:-obs}
    secureJsonData:
      password: ${OBS_POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
